- aid: anchorage:anchorage-onboarding-api
  name: Anchorage Digital Onboarding API
  description: "These endpoints allow clients/partner institutions to start the customer onboarding process for\
    \ a B2B2B/B2B2C end customer who would not be using the Anchorage Digital applications directly. They collect\
    \ the required data and documentation for Anchorage Digital to satisfy its regulatory obligations to perform\
    \ KYB/KYC, CIP, CDD and EDD on its customers and related parties.\n\nCurrently only B2B2B/B2B2C customer onboarding\
    \ is supported.\n\n### Payload Data\nThe \"customer\" endpoints take a payload of `entries` in an array of key/value\
    \ pairs. Details on the required and support key/value pairs is available in documentation provided by Anchorage\
    \ Digital. Please contact your Customer Experience representative for details.\n\nNote that some of the keys\
    \ are conditional depending on the presence or value of other key/value pairs. For example, the key `legalStructureOther`\
    \ is only required if the `legalStructure` key has the Enum value `OTHER`.\n\nAlso note that every `value` field\
    \ accepts primitives, objects and collections, which makes the payload very flexible for the client's needs.\n\
    For example, both of the following `entries` are accepted and interchangeable:\n\n```json\n{\n  \"entries\"\
    :[\n    {\n      \"key\":\"boolField\",\n      \"value\":true\n    },\n    {\n      \"key\":\"numberField\"\
    ,\n      \"value\":10\n    },\n    {\n      \"key\":\"stringField\",\n      \"value\":\"stringFieldValue\"\n\
    \    },\n    {\n      \"key\":\"collectionField\",\n      \"value\":[\n        \"collectionField0Value\",\n\
    \        \"collectionField1Value\"\n      ]\n    },\n    {\n      \"key\":\"objectField\",\n      \"value\"\
    :{\n        \"field0\":\"field0Value\",\n        \"field1\":\"field1Value\",\n        \"field2\":\"field2Value\"\
    \n      }\n    },\n    {\n      \"key\":\"objectCollectionField\",\n      \"value\":[\n        {\n         \
    \ \"field0\":\"field0AValue\",\n          \"field1\":\"field1AValue\",\n          \"field2\":\"field2AValue\"\
    \n        },\n        {\n          \"field0\":\"field0BValue\",\n          \"field1\":\"field1BValue\",\n  \
    \        \"field2\":\"field2BValue\"\n        }\n      ]\n    }\n  ]\n}\n```\n\n```json\n{\n  \"entries\":[\n\
    \    {\n      \"key\":\"boolField\",\n      \"value\":true\n    },\n    {\n      \"key\":\"numberField\",\n\
    \      \"value\":10\n    },\n    {\n      \"key\":\"stringField\",\n      \"value\":\"stringFieldValue\"\n \
    \   },\n    {\n      \"key\":\"collectionField.0\",\n      \"value\":\"collectionField0Value\"\n    },\n   \
    \ {\n      \"key\":\"collectionField.1\",\n      \"value\":\"collectionField1Value\"\n    },\n    {\n      \"\
    key\":\"objectField.field0\",\n      \"value\":\"field0Value\"\n    },\n    {\n      \"key\":\"objectField.field1\"\
    ,\n      \"value\":\"field1Value\"\n    },\n    {\n      \"key\":\"objectField.field2\",\n      \"value\":\"\
    field2Value\"\n    },\n    {\n      \"key\":\"objectCollectionField.0.field0\",\n      \"value\":\"field0AValue\"\
    \n    },\n    {\n      \"key\":\"objectCollectionField.0.field1\",\n      \"value\":\"field1AValue\"\n    },\n\
    \    {\n      \"key\":\"objectCollectionField.0.field2\",\n      \"value\":\"field2AValue\"\n    },\n    {\n\
    \      \"key\":\"objectCollectionField.1.field0\",\n      \"value\":\"field0BValue\"\n    },\n    {\n      \"\
    key\":\"objectCollectionField.1.field1\",\n      \"value\":\"field1BValue\"\n    },\n    {\n      \"key\":\"\
    objectCollectionField.1.field2\",\n      \"value\":\"field2BValue\"\n    }\n  ]\n}\n```"
  humanURL: https://docs.anchorage.com/knowledge-base/api-reference/introduction
  baseURL: https://api.anchorage.com/v2
  tags:
  - Onboarding
  properties:
  - type: OpenAPI
    url: openapi/anchorage-onboarding-api-openapi.yml
