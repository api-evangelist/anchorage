  description: 'Deposit Attribution is the process of gathering information about the originator of a given deposit.


    Once a deposit is initiated this process is automatically started being represented by a Deposit Attribution
    entity in `PENDING` status, so a deposit transaction has always an associated Deposit Attribution process and
    funds are not available until an attribution is performed.


    Once a deposit is confirmed on-chain, Anchorage Digital automatically initiates a new Deposit Attribution with
    a `PENDING` status. While in the `PENDING` status, funds are not available for movement or use for other purposes
    until the attribution process is complete. The attribution data is reviewed by Anchorage Digital, represented
    by the `UNDER_REVIEW` status. Upon successful completion of the review, the attribution status changes to `ATTRIBUTED`,
    making the funds available. If the review is unsuccessful, the status changes to `BLOCKED`.


    We do our best to automatically attribute deposits on behalf of our users, assuming the attribution for the
    specific address is known, but for those deposits where this is not possible, we enable the user to do so programmatically
    or via our Web Dashboard.


    Overall, these endpoints provide users with the capability to view, manage, and complete the deposit attribution
    process programmatically.'
  humanURL: https://docs.anchorage.com/knowledge-base/api-reference/introduction
  baseURL: https://api.anchorage.com/v2
  tags:
  - Deposit Attribution
  properties:
  - type: OpenAPI
    url: openapi/anchorage-deposit-attribution-api-openapi.yml
