aid: anchorage
name: Anchorage Digital
description: 'Anchorage Digital is the first federally chartered crypto bank in the U.S., providing institutional-grade
  digital asset infrastructure through its integrated Prime platform: qualified custody of crypto and USD, institutional
  trading with deep liquidity, staking across dozens of proof-of-stake networks, the Atlas on-chain settlement network,
  stablecoin issuance and conversion, and integrated cash-and-crypto banking. Its REST API v2.0 (and newer v3 surface)
  exposes 100+ operations across custody, wallets, addresses, transfers, transactions, trading, Atlas settlement,
  collateral management, onboarding, subaccounts, tax, stablecoins, and webhook notifications, secured with API
  keys plus Ed25519 request signing and quorum approval. Trusted by institutions including BlackRock, Goldman Sachs,
  and Grayscale.'
