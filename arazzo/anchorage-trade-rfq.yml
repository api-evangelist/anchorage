arazzo: 1.0.1
info:
  title: Anchorage Digital - Trade via RFQ
  version: 1.0.0
  summary: Request a quote, accept it, and confirm the resulting order and trade.
  x-realizes-capability-ids:
  - BC-1370.30
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-1370.30
      capability_name: Trading Order Management
      spec: anchorage-trading-api-openapi.yml
      confidence: 0.8
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: tradingApi
  url: ../openapi/anchorage-trading-api-openapi.yml
  type: openapi
workflows:
- workflowId: tradeViaRFQ
  summary: Request-for-quote trade with confirmation.
  steps:
  - stepId: listPairs
    operationId: getTradePairs
    successCriteria:
    - condition: $statusCode == 200
  - stepId: requestQuote
    operationId: requestQuote
    outputs:
      quoteId: $response.body#/quoteId
  - stepId: acceptQuote
    operationId: acceptQuote
    outputs:
      orderId: $response.body#/orderId
  - stepId: confirmOrder
    operationId: getOrderStatus
    parameters:
    - name: orderId
      in: path
      value: $steps.acceptQuote.outputs.orderId
    successCriteria:
    - condition: $statusCode == 200
