openapi: 3.2.0
info:
  version: 2.0.0
  title: Anchorage Digital API Reference Subaccounts API
  contact:
    email: api@anchorage.com
  description: '# Introduction

    *CONFIDENTIAL: Please do not distribute this documentation externally without prior Anchorage Digital approval.*


    The Anchorage Digital REST API v2.0 provides a set of operations and resources that allow Anchorage Digital clients and partners to:

    - Programmatically transfer funds from an Anchorage Digital vault or wallet without human intervention

    - Create and list deposit addresses in a vault

    - Read and monitor vault balances

    - Query transaction history including deposits

    …'
servers:
- url: https://api.anchorage-staging.com/v2
security:
- Api-Access-Key: []
tags:
- description: These endpoints allow the organization to manage subaccounts.
  name: Subaccounts
paths:
  /subaccounts/accounts/{subaccountId}/wallets:
    get:
      operationId: getSubaccountWallets
      summary: Return wallets linked to a subaccount
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Return wallets linked to a subaccount'
      parameters:
      - name: networkIds
        in: query
        schema:
          type: array
          items:
            type: string
        explode: false
        style: form
      - name: subaccountId
        in: path
        description: Unique Identifier for the subaccount
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully returned linked wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubaccountWalletResponse'
                required:
                - data
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/accounts/{subaccountId}/bank-info:
    get:
      operationId: subaccountBankInfo
      summary: Return bank information for a subaccount
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Return bank information for a subaccount'
      parameters:
      - name: subaccountId
        in: path
        description: Unique Identifier for the subaccount
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully returned bank info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankInfoResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/customers/{customerId}/accounts:
    post:
      operationId: createSubaccount
      summary: Create a new subaccount for a given program customer
      description: 'Permissions required: **Subaccount**


        Open a new subaccount for the program customer


        DEPRECATED, please use /onboarding/accounts'
      parameters:
      - name: customerId
        in: path
        description: Unique Identifier for the program customer
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubaccountRequest'
      responses:
        '200':
          description: Successfully created the subaccount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubaccountResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      deprecated: true
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
    get:
      operationId: getSubaccountsByCustomerId
      summary: List subaccounts
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Return all subaccounts associated to a customerId'
      parameters:
      - name: customerId
        in: path
        description: Unique Identifier for the customer
        required: true
        schema:
          type: string
      - name: endDate
        in: query
        description: The end date (inclusive) in `YYYY-MM-DD` format. The latest valid end date is the current date. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        schema:
          type: string
          format: date
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: statuses
        in: query
        description: Filter subaccounts by status
        schema:
          type: array
          items:
            type: string
        explode: false
        style: form
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Successfully returned subaccounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/customers/accounts:
    get:
      operationId: getAllSubaccounts
      summary: List all subaccounts
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Return all subaccounts associated for an organization'
      parameters:
      - name: subaccountIds
        in: query
        description: Array of Unique Identifiers for the subaccount
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
        style: form
      - name: externalIds
        in: query
        description: Array of Unique Identifiers within an external system
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
        style: form
      - name: endDate
        in: query
        description: The end date (inclusive) in `YYYY-MM-DD` format. The latest valid end date is the current date. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        schema:
          type: string
          format: date
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: statuses
        in: query
        description: Filter subaccounts by status
        schema:
          type: array
          items:
            type: string
        explode: false
        style: form
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Successfully returned subaccounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/accounts/{subaccountId}:
    patch:
      operationId: updateSubaccount
      summary: Update an existing subaccount
      description: 'Permissions required: **Subaccount**


        Update a subaccount'
      parameters:
      - name: subaccountId
        in: path
        description: Unique Identifier for the subaccount
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubaccountRequest'
      responses:
        '200':
          description: Successfully updated the subaccount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSubaccountResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
  /subaccounts/transactions:
    post:
      operationId: createSubaccountTransaction
      summary: Create new transactions
      description: 'Permissions required: **Subaccount**


        Create new transactions between subaccounts of the same Program Customer. This is a transactional operation, all transactions will be created successfully or none will.'
      parameters:
      - name: Api-Signature
        in: header
        description: "A hex-encoded Ed25519 signature of `timestamp_epoch_seconds + uppercase(http_method) + request_path + request_body`.\n\n\n\nConstruction example:\n\n  ```\n  toHex(\n    ed25519Sign(\n      signing_key,\n      '{}{}{}{}'.format(timestamp_epoch_seconds, toUpper(httpMethod), httpRequestPath, httpBody)\n    )\n  )\n  ```\n"
        required: true
        schema:
          type: string
          pattern: ^[0-9A-Fa-f]{128,160}$
      - name: Api-Timestamp
        in: header
        description: Current timestamp, represented as unix epoch seconds
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubaccountTransactionRequest'
      responses:
        '200':
          description: Successfully created the transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubaccountTransactionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
    get:
      operationId: getSubaccountTransactions
      summary: List all transactions
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Return all the transactions, sorted by the creation date, the client has access to'
      parameters:
      - name: subaccountId
        in: query
        description: Unique Identifier for the Subaccount
        required: false
        schema:
          type: string
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      - name: statuses
        in: query
        description: One or more transaction statuses to filter results
        schema:
          type: array
          items:
            type: string
            enum:
            - POSTED
            - PENDING
            - CANCELED
          uniqueItems: true
        explode: false
        style: form
      - name: types
        in: query
        description: One or more transaction types to filter results
        schema:
          type: array
          items:
            type: string
            enum:
            - DEPOSIT
            - WITHDRAWAL
            - TRADE
            - TRADE_SETTLEMENT
            - MANAGEMENT_FEE
            - CUSTODY_FEE
            - ADVISORY_FEE
            - MODEL_FEE
            - FEE_SETTLEMENT
            - SUBACCOUNT_TRANSFER
            - STAKING_REWARD
            - DELEGATION_REWARD
          uniqueItems: true
        explode: false
        style: form
      - name: startDate
        in: query
        description: The start date (inclusive) in `YYYY-MM-DD` format. The earliest valid start date is '2017-01-01`. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: The end date (inclusive) in `YYYY-MM-DD` format. The earliest valid start date is '2017-01-01`. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: A list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountTransactionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/transactions/{transactionsIds}:
    get:
      operationId: getSubaccountTransactionsById
      summary: Get list of transactions filter by ID
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Return the requested transactions, sorted by the creation date, the client has access too'
      parameters:
      - name: transactionsIds
        in: path
        description: Unique Identifiers for the transaction. Invalid transactionIds will be ignored.
        required: true
        schema:
          type: array
          items:
            type: string
        style: simple
      - name: startDate
        in: query
        description: The start date (inclusive) in `YYYY-MM-DD` format. The earliest valid start date is '2017-01-01`. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: The end date (inclusive) in `YYYY-MM-DD` format. The latest valid end date is the current date. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        schema:
          type: string
          format: date
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: A list of requested transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountTransactionsByIdResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/transactions/allocations:
    post:
      operationId: createFundingAllocations
      summary: Create new allocations
      description: 'Permissions required: **Subaccount**


        Create new allocation of pre-funded values between the Funding and Program Customers'' subaccounts. This is a transactional operation, all transactions will be created successfully or none will.'
      parameters:
      - name: Api-Signature
        in: header
        description: "A hex-encoded Ed25519 signature of `timestamp_epoch_seconds + uppercase(http_method) + request_path + request_body`.\n\n\n\nConstruction example:\n\n  ```\n  toHex(\n    ed25519Sign(\n      signing_key,\n      '{}{}{}{}'.format(timestamp_epoch_seconds, toUpper(httpMethod), httpRequestPath, httpBody)\n    )\n  )\n  ```\n"
        required: true
        schema:
          type: string
          pattern: ^[0-9A-Fa-f]{128,160}$
      - name: Api-Timestamp
        in: header
        description: Current timestamp, represented as unix epoch seconds
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFundingAllocationsRequest'
      responses:
        '200':
          description: Successfully created the transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFundingAllocationsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
    get:
      operationId: getFundingAllocations
      summary: Fetches a set of filtered transactions allocations
      description: 'Permissions required: **Subaccount** or **Read Subaccount**


        Retrieves a filtered set of transactions that are connected to funding allocations.'
      parameters:
      - name: subaccountIds
        in: query
        description: Array of Unique Identifiers for the subaccount
        required: false
        schema:
          type: array
          items:
            type: string
        explode: false
        style: form
      - name: startDate
        in: query
        description: The start date (inclusive) in `YYYY-MM-DD` format. The earliest valid start date is '2017-01-01`. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        required: false
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        description: The end date (inclusive) in `YYYY-MM-DD` format. The latest valid end date is the current date. Dates are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'full-date'.
        required: false
        schema:
          type: string
          format: date
      - name: transactionsTypes
        in: query
        description: Filters by DEPOSITs, WITHDRAWALs or both (default)
        schema:
          type: array
          items:
            type: string
            enum:
            - DEPOSIT
            - WITHDRAWAL
          uniqueItems: true
        explode: false
        style: form
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: A list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubaccountTransactionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Subaccounts
      x-security:
        Subaccount: present
        Read Subaccount: present
  /subaccounts/{subaccountId}/fiat/withdrawals:
    post:
      operationId: createSubaccountWithdrawal
      summary: Create a USD Withdrawal Request for a subaccount
      description: 'Permissions required: **Subaccount**


        Creates a USD Withdrawal Request for an Asset within a Subaccount (FIAT only for now)


        This will trigger an e-mail to be sent to the program customer to authorize the withdrawal.'
      parameters:
      - name: subaccountId
        in: path
        description: Unique Identifier for the subaccount
        required: true
        schema:
          type: string
      - name: Api-Signature
        in: header
        description: "A hex-encoded Ed25519 signature of `timestamp_epoch_seconds + uppercase(http_method) + request_path + request_body`.\n\n\n\nConstruction example:\n\n```\n\ntoHex(\n\n\ted25519Sign( \tsigning_key, \t'{}{}{}{}'.format(timestamp_epoch_seconds, toUpper(httpMethod), httpRequestPath, httpBody) \t) )\n\n```\n"
        required: true
        schema:
          type: string
          pattern: ^[0-9A-Fa-f]{128,160}$
      - name: Api-Timestamp
        in: header
        description: Current timestamp, represented as unix epoch seconds
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubaccountWithdrawalRequest'
      responses:
        '200':
