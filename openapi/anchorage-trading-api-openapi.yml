                      - price: '101003.14'
                        size: '5.00000000'
                      - price: '100998.21'
                        size: '10.00000000'
                      offers:
                      - price: '101253.98'
                        size: '1.00000000'
                      - price: '101253.98'
                        size: '5.00000000'
                      - price: '101253.98'
                        size: '10.00000000'
                      amountBuckets: []
              schema:
