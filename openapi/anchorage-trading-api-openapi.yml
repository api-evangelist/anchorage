openapi: 3.2.0
info:
  version: 2.0.0
  title: Anchorage Digital API Reference Trading API
  contact:
    email: api@anchorage.com
  description: '# Introduction

    *CONFIDENTIAL: Please do not distribute this documentation externally without prior Anchorage Digital approval.*


    The Anchorage Digital REST API v2.0 provides a set of operations and resources that allow Anchorage Digital clients and partners to:

    - Programmatically transfer funds from an Anchorage Digital vault or wallet without human intervention

    - Create and list deposit addresses in a vault

    - Read and monitor vault balances

    - Query transaction history including deposits

    …'
servers:
- url: https://api.anchorage-staging.com/v2
security:
- Api-Access-Key: []
tags:
- description: 'API endpoints for managing RFQ, Market or Limit orders


    Anchorage Digital websocket API documentation.'
  name: Trading
paths:
  /trading/quote:
    post:
      operationId: requestQuote
      summary: Request a quote
      description: 'Permissions required: **Execute trades**


        Request a quote


        #### Idempotent Requests


        This endpoint supports idempotent requests so that quote is not requested twice if an API call was interrupted and must be retried. To send an idempotent request, include the `idempotentId` field in the body of the POST request.'
      parameters: []
      requestBody:
        description: "*Request for quote examples*\n\n**`BUY` quote requests:**\n- I want to buy the amount of BTC equivalent to 100 USD (I buy BTC and sell USD)\n  ```\n  {\n    \"tradingPair\": \"BTC-USD\",\n    \"side\": \"BUY\",\n    \"quantity\": \"100\",\n    \"currency\": \"USD\"\n  }\n  ```\n\n- I want to buy 1 BTC (I buy BTC and sell USD)\n  ```\n  {\n    \"tradingPair\": \"BTC-USD\",\n    \"side\": \"BUY\",\n    \"quantity\": \"1\",\n    \"currency\": \"BTC\"\n  }\n  ```\n\n- I want to buy the amount of ETH equivalent to 1 BTC (I buy ETH and sell BTC)\n  ```\n  {\n    \"tradingPair\": \"ETH-BTC\",\n    \"side\": \"BUY\",\n    \"quantity\": \"1\",\n    \"currency\": \"BTC\"\n  }\n  ```\n\n**`SELL` quote requests:**\n- I want to sell the amount of BTC equivalent to 100 USD (I sell BTC and buy USD)\n  ```\n  {\n    \"tradingPair\": \"BTC-USD\",\n    \"side\": \"SELL\",\n    \"quantity\": \"100\",\n    \"currency\": \"USD\"\n  }\n  ```\n\n- I want to sell 1 BTC (I sell BTC and buy USD)\n  ```\n  {\n    \"tradingPair\": \"BTC-USD\",\n    \"side\": \"SELL\",\n    \"quantity\": \"1\",\n    \"currency\": \"BTC\"\n  }\n  ```\n\n- I want to sell 1 ETH (I sell ETH and buy BTC)\n  ```\n  {\n    \"tradingPair\": \"ETH-BTC\",\n    \"side\": \"SELL\",\n    \"quantity\": \"1\",\n    \"currency\": \"ETH\"\n  }\n  ```\n\n**`TWOWAY` quote requests:**\n- I want two-way quotes to buy 1 ETH and sell BTC or to sell 1 ETH and buy BTC\n  ```\n  {\n    \"tradingPair\": \"ETH-BTC\",\n    \"side\": \"TWOWAY\",\n    \"quantity\": \"1\",\n    \"currency\": \"ETH\"\n  }\n  ```\n"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetQuoteRequest'
      responses:
        '201':
          description: Successfully created request for quote
          content:
            application/json:
              examples:
                response:
                  value:
                    data:
                      offerAmount:
                        assetType: USD
                        quantity: '11733.73'
                      offerPrice: '11733.73'
                      quoteID: 06f71d1e-e7e8-11ea-adc1-0242ac120002
                      quoteRequest:
                        currency: BTC
                        quantity: '1'
                        side: BUY
                        tradingPair: BTC-USD
                      quoteStatus: OPEN
                      timestamp: '2020-08-31T16:57:07.265Z'
                      validUntilTime: '2020-08-31T16:57:10.265Z'
              schema:
                $ref: '#/components/schemas/GetQuoteResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Trading
      x-security:
        Execute trades: present
  /trading/quote/accept:
    post:
      operationId: acceptQuote
      summary: Accept a quote
      description: 'Permissions required: **Execute trades**


        Accept a quote by its quoteID and side.


        #### Idempotent Requests


        This endpoint supports idempotent requests so that a quote cannot be accepted twice if an API call was interrupted and is retried. To send an idempotent request, include the `idempotentId` field in the body of the POST request.'
      parameters:
      - name: Api-Signature
        in: header
        description: "A hex-encoded Ed25519 signature of `timestamp_epoch_seconds + uppercase(http_method) + request_path + request_body`.\n\nConstruction example:\n```\n  toHex(\n    ed25519Sign(\n      signing_key,\n      '{}{}{}{}'.format(timestamp_epoch_seconds, toUpper(httpMethod), httpRequestPath, httpBody)\n    )\n  )\n```"
        required: true
        schema:
          type: string
          pattern: ^[0-9A-Fa-f]{128,160}$
      - name: Api-Timestamp
        in: header
        description: Current timestamp, represented as unix epoch seconds
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: "Request body to accept a quote\nexample:\n```\n  {\n    \"quoteID\": \"06f71d1e-e7e8-11ea-adc1-0242ac120002\",\n    \"side\": \"BUY\",\n  }\n```"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuoteRequest'
      responses:
        '200':
          description: Successfully accepted the quote
          content:
            application/json:
              examples:
                response:
                  value:
                    data:
                      quoteID: 06f71d1e-e7e8-11ea-adc1-0242ac120002
                      side: BUY
                      tradeStatus: EXECUTED
                      tradeID: d1ae1416-ebd7-11ea-adc1-0242ac120002
              schema:
                $ref: '#/components/schemas/AcceptQuoteResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found. The specified quoteID is either invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '409':
          description: Trade already exists
          content:
            application/json:
              examples:
                response:
                  value:
                    errorType: Conflict
                    message: tradeID=07ceab88-944f-4ea7-9ebf-9d1f5672b59a,tradeStatus=EXECUTED
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '422':
          description: Request exceeds credit limit
          content:
            application/json:
              examples:
                response:
                  value:
                    errorType: UnprocessableEntity
                    message: The amount requested exceeds credit limit
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Trading
      x-security:
        Execute trades: present
  /trading/order:
    post:
      operationId: newOrderSingle
      summary: Place an order
      description: 'Permissions required: **Execute trades**


        Place an order, either Market or Limit, currently only FillOrKill is supported.


        One of `accountId` or `subaccountId` must be specified but not both.'
      parameters: []
      requestBody:
        description: Parameters to place an order.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderSingle'
      responses:
        '201':
          description: Successfully executed an order
          content:
            application/json:
              examples:
                response:
                  value:
                    data:
                      clOrderId: 6fb5fc79-0bb4-446d-82dd-d4687fb56a02
                      orderId: a94c8d75-6c9d-4903-95f3-5b0893e76cb7
                      execId: 3fb532c79-0bb4-446d-82dd-d4687fb56a02
                      accountId: 0e2b2f9d-8d10-4f1e-960b-28567255045f
                      symbol: BTC-USD
                      side: BUY
                      currency: USD
                      counterCurrency: BTC
                      orderType: MARKET
                      orderStatus: FILLED
                      avgPx: '21005.4'
                      avgPxAllIn: '21006.00'
                      orderQty: '10000.00'
                      cumQty: '10000.00'
                      counterQty: '0.4760680586896702'
                      fee: '0.00001359805'
                      feeCurrency: BTC
                      counterQtyAllIn: '0.4760544606302961'
                      transactTime: '2022-11-20T20:32:16.423Z'
              schema:
                $ref: '#/components/schemas/TradingOrderResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Trading
      x-security:
        Execute trades: present
  /trading/orders:
    get:
      operationId: getOrdersStatus
      summary: List orders
      description: 'Permissions required: **Execute trades** or **Read trade activity**


        List all orders. With the permission **Read trade activity** all orders of the organization may be read. With the permission **Execute trades** only the orders created by this API key may be read.


        Orders are sorted in a descending order by their timestamp, i.e. the most recent order or the order with a timestamp closest to `endDate` is listed first.


        When filtering by `subaccountId`, the allocation information is included but filtered to show only the allocation for the requested subaccount.

        For multi-order requests without a subaccount filter, allocation information is not included.

        To get complete allocation information, use GET `/v2/trading/orders/{orderId}`


        #### Filters


        You may optionally supply filters for the list of orders using query parameters below'
      parameters:
      - name: accountId
        in: query
        description: The ID of the account to filter orders by. If provided, only orders for this account will be returned.
        schema:
          type: string
      - name: subaccountId
        in: query
        description: The ID of the subaccount to filter orders by. If provided, only orders for this subaccount will be returned.
        schema:
          type: string
      - name: startDateTime
        in: query
        description: The start date-time of the trades (exclusive) in `YYYY-MM-DDTHH:MM:SS.nnnnnnnnn` format. The earliest valid start date-time is '2017-01-01T00:00:00.000000000'. The last valid start date-time is the current date-time. Date-times are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'date-time'.
        schema:
          type: string
          format: date-time
      - name: endDateTime
        in: query
        description: The end date-time of the trades (exclusive) in `YYYY-MM-DDTHH:MM:SS.nnnnnnnnn` format. The latest valid end date-time is the current date-time. The earliest valid end date-time is '2017-01-01T00:00:00.000000000'. Date-times are always in UTC [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) 'date-time'.
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: One or more statuses to filter orders. If provided, only orders matching these statuses will be returned. If `OPEN` status is specified, the call returns all orders in [PENDING,NEW,PENDING_CANCEL,PARTIALLY_FILLED] states.
        schema:
          type: array
          items:
            type: string
            enum:
            - OPEN
            - REJECTED
            - CANCELED
            - FILLED
          uniqueItems: true
        explode: false
        style: form
      - name: orderIds
        in: query
        description: A list of `orderIds` to return. Invalid `orderIds` will be ignored. A maximum number of unique 500 order ids are enforced per call.
        schema:
          type: array
          items:
            type: string
          maxItems: 500
          minItems: 1
          uniqueItems: true
        explode: false
        style: form
      - name: clientOrderIds
        in: query
        description: A list of `clientOrderIds` to return. Invalid `clientOrderIds` will be ignored. A maximum number of unique 500 order ids are enforced per call.
        schema:
          type: array
          items:
            type: string
          maxItems: 500
          minItems: 1
          uniqueItems: true
        explode: false
        style: form
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 100
          maximum: 2000
          minimum: 1
      - name: orderTypes
        in: query
        description: One or more types to filter orders. If provided, only orders matching these types will be returned.
        schema:
          type: array
          items:
            type: string
            enum:
            - LIMIT
            - MARKET
            - STOP_LOSS
            - STOP_LIMIT
            - TAKE_PROFIT_LIMIT
            - TWAP
            - VWAP
            - PEGGED
            - POV
            - LIMIT_ALL_IN
            - MANUAL
            - OTHER
          uniqueItems: true
        explode: false
        style: form
      responses:
        '200':
          description: A list of Orders and their last status
          content:
            application/json:
              examples:
                response:
                  value:
                    data:
                    - orderId: c6d8c4a8-e883-4ae3-9f35-4a35d06c383d
                      clOrderId: 40d846b7-6efb-48fa-acc9-dcace827c927
                      accountId: a05a846f-4ef0-11ed-a291-dafe71b41c83
                      symbol: BTC-USD
                      side: BUY
                      orderQty: '1.0'
                      currency: BTC
                      orderType: MARKET
                      timeInForce: GTC
                      orderStatus: FILLED
                      avgPx: '22840.9299'
                      avgPxAllIn: '22863.7708299'
                      leavesQty: '0.0'
                      cancelQty: '0.0'
                      cumQty: '1.0'
                      totalFee: '25.35'
                      feeCurrency: USD
                      rejectReason: ''
                      rejectReasonText: ''
                      submitTime': '2023-03-07T19:49:06.286737Z'
                      transactTime: '2023-03-07T19:49:06.314322Z'
                    page:
                      next: /v2/trading/orders?endDate=2020-08-31T22:14:07Z&limit=2
              schema:
                $ref: '#/components/schemas/OrdersStatusResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Trading
      x-security:
        Execute trades: present
        Read trade activity: present
  /trading/orders/{orderId}:
