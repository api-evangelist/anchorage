      - CURRENT_LEDGER
      - OPENING_AVAILABLE
      - OPENING_AVAILABLE_NEXT_BUSINESS_DAY
      - OPENING_LEDGER
      - OTHER
      - PREVIOUSLY_CLOSED_BOOK
    WireResponse:
      type: object
      properties:
