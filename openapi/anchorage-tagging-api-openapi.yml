openapi: 3.2.0
info:
  version: 2.0.0
  title: Anchorage Digital API Reference Tagging API
  contact:
    email: api@anchorage.com
  description: '# Introduction

    *CONFIDENTIAL: Please do not distribute this documentation externally without prior Anchorage Digital approval.*


    The Anchorage Digital REST API v2.0 provides a set of operations and resources that allow Anchorage Digital clients and partners to:

    - Programmatically transfer funds from an Anchorage Digital vault or wallet without human intervention

    - Create and list deposit addresses in a vault

    - Read and monitor vault balances

    - Query transaction history including deposits

    …'
servers:
- url: https://api.anchorage-staging.com/v2
security:
- Api-Access-Key: []
tags:
- description: These endpoints allow creating, applying, removing, and searching tags on operations.
  name: Tagging
paths:
  /tags:
    get:
      operationId: listTags
      summary: List tags
      description: List tags filtered by ownership type and/or entity. When entityId is provided, returns tags applied to that entity. When type is provided, filters tag definitions by ownership type.
      parameters:
      - name: type
        in: query
        description: Filter tags by ownership type (system, backoffice, client)
        required: false
        schema:
          type: string
          enum:
          - system
          - backoffice
          - client
      - name: entityId
        in: query
        description: Return tags applied to this entity ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of tags matching the filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tagging
      x-hidden: true
      x-mint:
        href: api-reference/v2/tags/list-tags
      x-security:
        Read vault activity: present
    post:
      operationId: createTag
      summary: Create a tag
      description: Create a new tag. Tags are also auto-created on first use via POST /v2/tags/apply, so explicit creation is optional.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTagResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '409':
          description: Conflict - tag already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tagging
      x-hidden: true
      x-mint:
        href: api-reference/v2/tags/create-a-tag
      x-security:
        Read vault activity: present
  /tags/apply:
    post:
      operationId: applyTags
      summary: Apply tags to an entity
      description: Apply one or more tags to an entity. Tags are auto-created if they do not exist.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTagsRequest'
      responses:
        '200':
          description: Tags applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyTagsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tagging
      x-hidden: true
      x-mint:
        href: api-reference/v2/tags/apply-tags-to-an-entity
      x-security:
        Read vault activity: present
  /tags/apply/{entityId}/{tagName}:
    delete:
      operationId: deleteAppliedTag
      summary: Remove a tag from an entity
      description: Remove a specific tag from an entity. Tag name matching is case-insensitive.
      parameters:
      - name: entityId
        in: path
        description: The entity ID to remove the tag from
        required: true
        schema:
          type: string
      - name: tagName
        in: path
        description: The name of the tag to remove (case-insensitive)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tag removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAppliedTagResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found - tag not applied to this entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tagging
      x-hidden: true
      x-mint:
        href: api-reference/v2/tags/remove-a-tag-from-an-entity
      x-security:
        Read vault activity: present
  /tags/search:
    get:
      operationId: searchTags
      summary: Search entities by tag
      description: Search for entities that have specific tags applied. Supports cursor-based pagination.
      parameters:
      - name: name
        in: query
        description: Comma-separated list of tag names to search by
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Filter results by entity type (e.g. withdrawal, transfer)
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: Cursor for pagination (entity_id of last seen result)
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 'Number of results to return (default: 20, max: 100)'
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: Sort order by tag application time
        required: false
        schema:
          type: string
          default: desc
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Entities matching the tag search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTagsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tagging
      x-hidden: true
      x-mint:
        href: api-reference/v2/tags/search-entities-by-tag
      x-security:
        Read vault activity: present
components:
  schemas:
    SearchTagsResponse:
      type: object
      properties:
        data:
          description: Entities matching the tag search
          type: array
          items:
            $ref: '#/components/schemas/TaggingResult'
        pagination:
          $ref: '#/components/schemas/TaggingPagination'
      required:
      - data
      - pagination
      title: SearchTagsResponse
    ApplyTagsResponse:
      type: object
      properties:
        warnings:
          description: Warnings encountered during tag application (e.g. TAG_LIMIT_REACHED)
          type:
          - array
          - 'null'
          items:
            type: string
      title: ApplyTagsResponse
    TagType:
      description: The ownership type of a tag.
      type: string
      enum:
      - system
      - backoffice
      - client
      title: TagType
    EntityTagsData:
      type: object
      properties:
        tags:
          description: List of tags applied to the entity
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
      - tags
      title: EntityTagsData
    DeleteAppliedTagResponse:
      type: object
      properties:
        deleted:
          description: The name of the tag that was removed
          type: string
          example: urgent
      required:
      - deleted
      title: DeleteAppliedTagResponse
    CreateTagResponse:
      type: object
      properties:
        id:
          description: The unique identifier of the created tag
          type: string
          example: '208045946'
        name:
          description: The name of the tag
          type: string
          example: urgent
        tagType:
          $ref: '#/components/schemas/TagType'
      required:
      - id
      - name
      - tagType
      title: CreateTagResponse
    ApplyTagsRequest:
      type: object
      properties:
        entityId:
          description: The ID of the entity to tag
          type: string
          example: abc123
        entityType:
          description: The type of entity being tagged (e.g. transfer, withdrawal)
          type: string
          example: withdrawal
        tags:
          description: List of tag names to apply
          type: array
          items:
            type: string
          minItems: 1
        tagType:
          $ref: '#/components/schemas/TagType'
      required:
      - entityId
      - entityType
      - tagType
      - tags
      title: ApplyTagsRequest
    TaggingResult:
      type: object
      properties:
        createdAt:
          description: When the tag association was created (RFC3339)
          type: string
          example: '2026-03-19T10:00:00Z'
        entityId:
          description: The entity ID
          type: string
          example: abc123
        entityType:
          description: The entity type
          type: string
          example: withdrawal
        tags:
          description: Tags applied to this entity
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      required:
      - entityId
      - entityType
      - createdAt
      - tags
      title: TaggingResult
    Tag:
      type: object
      properties:
        name:
          description: The name of the tag (case-insensitive, max 25 chars)
          type: string
          example: urgent
        tagType:
          $ref: '#/components/schemas/TagType'
      required:
      - name
      - tagType
      title: Tag
    CreateTagRequest:
      type: object
      properties:
        name:
          description: Tag name (max 25 chars, letters/numbers/underscores/hyphens only)
          type: string
          example: urgent
          maxLength: 25
          pattern: ^[a-zA-Z0-9_-]+$
        tagType:
          $ref: '#/components/schemas/TagType'
      required:
      - name
      - tagType
      title: CreateTagRequest
    ListTagsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EntityTagsData'
      required:
      - data
      title: ListTagsResponse
    ErrorType:
      description: The type of error returned.
      type: string
      enum:
      - InternalError
      - InvalidRequest
      - Unauthenticated
      - Forbidden
      - NotFound
      - Conflict
      - UnprocessableEntity
      - TooManyRequests
      - ServiceUnavailable
      - QuoteExpired
      - InsufficientFunds
      - NotImplemented
      title: ErrorType
    TaggingPagination:
      type: object
      properties:
        hasMore:
          description: Whether there are more results available
          type: boolean
        limit:
          description: Number of results per page
          type: integer
        nextCursor:
          description: Cursor for the next page; null if no more results
          type:
          - string
          - 'null'
      required:
      - hasMore
      - limit
      title: TaggingPagination
    ErrorDetails:
      type: object
      properties:
        errorType:
          $ref: '#/components/schemas/ErrorType'
        message:
          description: A human-readable message providing more details about the error.
          type: string
          example: Missing required field 'amount'.
      required:
      - errorType
      - message
      title: ErrorDetails
  securitySchemes:
    Api-Access-Key:
      type: apiKey
      name: Api-Access-Key
      in: header
      description: An API key associated with a security role
x-tagGroups:
- name: Under Development
  tags:
  - Collateral Management
  - Holds
  - Deposit Attribution
  - Onboarding
  - Trusted Destinations
  - Atlas Settlement Network
  - Tax
- name: API Endpoints
  tags:
  - Addresses
  - Asset Types
  - Transactions
  - Transfers
  - Wallets
  - Vaults
  - Vesting
  - Tagging
  - Subaccounts
  - Stablecoins
  - Webhook Notifications
  - API Key
  - Statements
  - Tax Reporting
  - Trading
- name: Models
  tags:
  - Transfer Model
  - Transaction Model
  - Vault Model
  - Deposit Attribution Model
