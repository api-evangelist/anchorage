      tags:
        - Wallets
  /wallets/{walletId}/daily-rewards:
    get:
      operationId: getDailyWalletRewards
      summary: Get Daily Wallet Rewards (Aggregated)
      description: >-
        Permissions required: **Read vault activity**


        Get daily aggregated rewards for a wallet over a specified date range
        (maximum 31 days).
      parameters:
        - name: walletId
          in: path
          description: The unique identifier of the wallet
          required: true
          schema:
            type: string
        - name: rewardTypes
          in: query
          description: >-
            Reward types to include. Only the specified types will be returned.


            **Note:** Do not query both an aggregate type and its component
            granular types in the same request to avoid double-counting.


            Solana reward types.


            * `DELEGATION_REWARDS` - Standard staking delegation rewards

            * `DELEGATION_MEV_REWARDS` - MEV rewards from staking delegation


            Ethereum reward types.


            **Aggregate types:**

            * `CONSENSUS_LAYER_REWARDS` - Sum of BLOCK_PROPOSER_REWARDS +
            ATTESTATION_REWARDS + SYNC_COMMITTEE_REWARDS

            * `EXECUTION_LAYER_REWARDS` - Execution layer rewards including
            transaction fees and MEV


            **Granular types:**

            * `BLOCK_PROPOSER_REWARDS` - Block proposal rewards

            * `ATTESTATION_REWARDS` - Block attestation rewards

            * `SYNC_COMMITTEE_REWARDS` - Sync committee participation rewards
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                - DELEGATION_MEV_REWARDS
                - DELEGATION_REWARDS
                - CONSENSUS_LAYER_REWARDS
                - EXECUTION_LAYER_REWARDS
                - BLOCK_PROPOSER_REWARDS
                - ATTESTATION_REWARDS
                - SYNC_COMMITTEE_REWARDS
            minItems: 1
          example:
            - DELEGATION_MEV_REWARDS
            - DELEGATION_REWARDS
        - name: assetType
          in: query
          description: Filter rewards by asset type.
          required: false
          schema:
            type: string
          example: ETH
        - name: startDate
          in: query
          description: >-
            The start date (inclusive) in `YYYY-MM-DD` format. Dates are always
            in UTC [RFC
            3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            'full-date'.
          required: true
          schema:
            type: string
            format: date
          example: '2024-01-01'
        - name: endDate
          in: query
          description: >-
            The end date (inclusive) in `YYYY-MM-DD` format. Maximum range is 31
            days from startDate. Dates are always in UTC [RFC
            3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            'full-date'.
          required: true
          schema:
            type: string
            format: date
          example: '2024-01-31'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRewardsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
        - Wallets
