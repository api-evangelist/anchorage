paths:
  /addresses:
    get:
      operationId: listAddresses
      summary: List Addresses
      description: |-
        Permissions required: **Read vault activity**

        List all addresses across wallets in the organization.
      parameters:
        - name: after
          in: query
          description: >-
            When paginating this is used to provide the starting point for the
            page to fetch (retrieved from the previous response body)
          schema:
            type: string
        - name: address
          in: query
          description: Filter by specific blockchain address
          required: false
          schema:
            type: string
        - name: networkId
          in: query
          description: >-
            A unique string identifying a combination of blockchain and
            environment (testnet, mainnet).
          required: false
          schema:
            type: string
        - name: vaultId
          in: query
          description: Filter by vault ID
          required: false
          schema:
            type: string
        - name: walletId
          in: query
          description: Filter by wallet ID
          required: false
          schema:
            type: string
        - name: batchId
          in: query
          description: Filter by batch creation ID
          required: false
          schema:
            type: string
        - name: publicKey
          in: query
          description: Filter by public key string
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAddressesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
