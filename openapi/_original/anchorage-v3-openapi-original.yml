      summary: Get Wallet Rewards (Per-Event)
      description: |-
        Permissions required: **Read vault activity**

        Get individual reward events for a wallet over a specified date range.
      parameters:
        - name: walletId
          in: path
          description: The unique identifier of the wallet
          required: true
          schema:
            type: string
        - name: rewardType
          in: query
          description: >-
            The reward type to query.


            Solana reward types.


            * `DELEGATION_REWARDS` - Standard staking delegation rewards

            * `DELEGATION_MEV_REWARDS` - MEV rewards from staking delegation


            Ethereum reward types.


            * `EXECUTION_LAYER_REWARDS` - Execution layer rewards including
            transaction fees and MEV

            * `BLOCK_PROPOSER_REWARDS` - Block proposal rewards

            * `ATTESTATION_REWARDS` - Block attestation rewards

            * `SYNC_COMMITTEE_REWARDS` - Sync committee participation rewards
          required: true
          schema:
            type: string
            enum:
              - DELEGATION_MEV_REWARDS
              - DELEGATION_REWARDS
              - EXECUTION_LAYER_REWARDS
              - BLOCK_PROPOSER_REWARDS
              - ATTESTATION_REWARDS
              - SYNC_COMMITTEE_REWARDS
        - name: assetType
          in: query
          description: Filter rewards by asset type.
          required: true
          schema:
            type: string
          example: ETH
        - name: startDate
          in: query
          description: >-
            The start date (inclusive) in `YYYY-MM-DD` format. Dates are always
            in UTC [RFC
            3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            'full-date'.
          required: true
          schema:
            type: string
            format: date
          example: '2024-01-01'
        - name: endDate
          in: query
          description: >-
            The end date (inclusive) in `YYYY-MM-DD` format. Dates are always in
            UTC [RFC
            3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
            'full-date'.
          required: true
          schema:
            type: string
            format: date
          example: '2024-01-31'
        - name: first
          in: query
          description: Maximum number of results to return per query
          schema:
            type: integer
            format: int64
            default: 25
            maximum: 100
            minimum: 1
        - name: after
          in: query
          description: >-
            When paginating this is used to provide the starting point for the
            page to fetch (retrieved from the previous response body)
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRewardsListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
