            accounts and not part of the standard routing schemas.
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        currency:
          description: Currency code for permitted currency with this virtual account.
          type: string
          enum:
            - USD
        id:
          description: Unique identifier for the virtual account
          type: string
        liveMode:
          description: >-
            This field will be true if this object exists in the live
            environment or false if it exists in the test environment.
          type: boolean
        object:
          type: string
        parentAccountId:
          description: >-
            The parent internal account ID at the bank provider. This is the
