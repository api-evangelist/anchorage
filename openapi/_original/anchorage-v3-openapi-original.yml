    XLMNetworkSpecific:
      description: Stellar-specific network parameters for transaction construction
      type: object
      properties:
        baseFee:
          description: Transaction base fee in XLM
          type: string
        createDestination:
          description: >-
            Whether to create the destination account. Set to true to create a
            new account with the payment. Set to false to send payment to an
            existing account. Only applies to native XLM transfers; Stellar
            classic asset (token) transfers require the destination account to
            already exist with an established trustline.
          type: boolean
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: XLM
          enum:
            - XLM
        sequenceNumber:
          description: Sequence number for the source account
          type: string
      additionalProperties: false
      required:
        - mainnetNetworkId
        - sequenceNumber
        - baseFee
        - createDestination
      title: Stellar Network Specific
    XRPNetworkSpecific:
      description: XRP Ledger-specific network parameters for transaction construction
      type: object
      properties:
        fee:
          description: Transaction fee in XRP
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: XRP
          enum:
            - XRP
        sequence:
          description: Sequence number for the source account
          type: string
      additionalProperties: false
      required:
        - mainnetNetworkId
        - sequence
        - fee
      title: Ripple Network Specific
    FLOWNetworkSpecific:
      description: Flow-specific network parameters for transaction construction
      type: object
      properties:
        gasLimit:
          description: Maximum amount of computation that can be done
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: FLOW
          enum:
            - FLOW
        proposer:
          description: >-
            The proposal key for the transaction. If not specified, the "source"
            wallet is the sender.
          type: object
          additionalProperties: false
          properties:
            address:
              description: Address of the account proposing the transaction
              type: string
            keyIndex:
              description: Index of the key within the proposer account to use for signing
              type: integer
            sequenceNumber:
              description: Sequence number for the proposal key
              type: string
          required:
            - address
            - keyIndex
            - sequenceNumber
        referenceBlockId:
          description: >-
            ID of a recent block to reference. Transaction expires after ~10
            minutes from this block.
          type: string
        sender:
          description: >-
            Address of the account sending the assets. If no specified, the
            "source" wallet is the sender.
          type: string
          nullable: true
      additionalProperties: false
      required:
        - mainnetNetworkId
        - gasLimit
        - referenceBlockId
      title: Flow Network Specific
    APTNetworkSpecific:
      description: Aptos-specific network parameters for transaction construction
      type: object
      properties:
        expirationTimestampSecs:
          description: >-
            Unix timestamp in seconds after which the transaction expires and
            will be rejected by the network.
          type: string
        gasUnitPrice:
          description: Price per gas unit in APT. Higher values prioritize the transaction.
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: APT
          enum:
            - APT
        maxGasAmount:
          description: >-
            Maximum gas units the transaction can consume. The transaction fails
            if it exceeds this limit.
          type: string
        sequenceNumber:
          description: >-
            Sequence number for the source account. Each transaction from an
            account must have a unique, incrementing sequence number.
          type: string
      additionalProperties: false
      required:
        - mainnetNetworkId
        - sequenceNumber
        - gasUnitPrice
        - maxGasAmount
        - expirationTimestampSecs
      title: Aptos Network Specific
    SUICoin:
      description: A Sui coin object to be used for gas payment
      type: object
      properties:
        digest:
          description: Base58-encoded digest of the object
          type: string
          example: E3c6ybzozYmN551iTadDtDecrdiviv55fwMtL6U1MfrB
        objectId:
          description: Hex-encoded object ID of the coin
          type: string
          example: '0x0037cf382dc39fef8fa3dea79b9425ea636186dba86808d028644f1bafbd84e9'
        version:
          description: Version (sequence number) of the object
          type: string
      additionalProperties: false
      required:
        - objectId
        - version
        - digest
      title: Sui Gas Coin
    SUINetworkSpecific:
      description: >-
        Sui-specific network parameters for transaction construction. Exactly
        one principal source must be specified: either
        payPrincipalFromBalance=true or a non-empty objectsForPrincipal array.
        Exactly one fee source must be specified: payFeeFromBalance=true,
        payFeeFromPrincipalObjects=true, or a non-empty objectsForFee array.
      type: object
      properties:
        epoch:
          description: >-
            First epoch for the transaction validity window. Required when
            payFeeFromBalance is true.
          type: integer
          format: uint64
        gasBudget:
          description: >-
            Maximum gas budget in SUI. The transaction fails if execution cost
            exceeds this.
          type: string
        gasPrice:
          description: >-
            Gas price in SUI. Query the network for the current reference gas
            price.
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: SUI
          enum:
            - SUI
          x-go-type: apimodels.Network
          x-go-type-import:
            path: github.com/anchorlabsinc/anchorage/source/go/lib/restapi/apimodels
            name: apimodels
        nonce:
          description: >-
            Nonce for transaction replay protection. Required when
            payFeeFromBalance is true.
          type: integer
          format: uint32
        objectsForFee:
          description: >-
            Coin objects to use for fee payment. Must be empty when
            payFeeFromBalance or payFeeFromPrincipalObjects is true.
          type: array
          items:
            $ref: '#/components/schemas/SUICoin'
        objectsForPrincipal:
          description: >-
            Coin objects whose value funds the transfer principal. Must be empty
            when payPrincipalFromBalance is true. Required when
            payPrincipalFromBalance is false.
          type: array
          items:
            $ref: '#/components/schemas/SUICoin'
        payFeeFromBalance:
          description: >-
            When true, the transaction fee is paid from the sender's address
            balance. Mutually exclusive with payFeeFromPrincipalObjects and
            objectsForFee.
          type: boolean
        payFeeFromPrincipalObjects:
          description: >-
            When true, the principal coin objects are merged into the gas coin
            and the fee is paid from that merged coin. Requires
            objectsForPrincipal to be non-empty. Mutually exclusive with
            payFeeFromBalance and objectsForFee.
          type: boolean
        payPrincipalFromBalance:
          description: >-
            When true, the principal amount is paid from the sender's address
            balance. Mutually exclusive with objectsForPrincipal.
          type: boolean
        sender:
          description: >-
            Address of the account that sends the assets. Use this when the
            sender is different from the source wallet. If not specified, the
            source wallet is used as both the gas sponsor and the sender of
            assets.
          type: string
          nullable: true
        sendToBalance:
          description: >-
            When true, funds are deposited into the destination's address
            balance (send_funds). When false, funds arrive as a coin object
            (transfer_objects).
          type: boolean
      additionalProperties: false
      required:
        - mainnetNetworkId
        - payPrincipalFromBalance
        - sendToBalance
        - payFeeFromBalance
        - payFeeFromPrincipalObjects
        - gasPrice
        - gasBudget
      title: Sui Network Specific
    FILNetworkSpecific:
      description: Filecoin-specific network parameters for transaction construction
      type: object
      properties:
        gasFeeCap:
          description: >-
            Maximum price per gas unit in FIL. The total fee is capped at
            gasFeeCap * gasLimit.
          type: string
        gasLimit:
          description: Maximum gas units the message can consume.
          type: string
        gasPremium:
          description: Gas premium in FIL. This is the priority fee paid to miners.
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: FIL
          enum:
            - FIL
        nonce:
          description: >-
            Sequence number for the source account. Each message from an account
            must have a unique, incrementing nonce.
          type: string
      additionalProperties: false
      required:
        - mainnetNetworkId
        - nonce
        - gasPremium
        - gasFeeCap
        - gasLimit
      title: Filecoin Network Specific
    ADANetworkSpecific:
      description: Cardano-specific network parameters for transaction construction
      type: object
      properties:
        changeAddress:
          description: >-
            Address to send change to. If specified, any remainder after
            subtracting outputs and fee from UTXO inputs will be sent as change
            to this address.
          type: string
        changeAddressClientReferenceId:
          description: >-
            Client-provided reference ID to track the change output in their
            internal systems
          type: string
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        fee:
          description: Transaction fee in ADA
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: CARDANO
          enum:
            - CARDANO
        ttl:
          description: >-
            Time to live as an absolute slot number. The transaction is invalid
            after this slot.
          type: integer
          format: int64
        utxos:
          description: Unspent transaction outputs to use as inputs for the transaction
          type: array
          items:
            $ref: '#/components/schemas/UTXO'
      additionalProperties: false
      required:
        - mainnetNetworkId
        - utxos
        - fee
        - ttl
      title: Cardano Network Specific
    TendermintNetworkSpecific:
      description: >-
        Tendermint/Cosmos SDK-based network parameters for transaction
        construction. Supports Celestia (TIA), dYdX Chain (DYDX_CHAIN), and
        other Tendermint-based networks.
      type: object
      properties:
        accountNumber:
          description: Account number on the chain
          type: string
        fee:
          description: Transaction fee in the native currency of the network
          type: string
        gas:
          description: Gas limit for the transaction
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          enum:
            - TIA
            - DYDX_CHAIN
        sequence:
          description: Account sequence number for replay protection
          type: string
        timeoutHeight:
          description: Block height after which the transaction is invalid
          type: integer
          format: int64
      additionalProperties: false
      required:
        - mainnetNetworkId
        - sequence
        - accountNumber
        - gas
        - fee
      title: Tendermint Network Specific
    HBARNetworkSpecific:
      description: >-
        Hedera-specific network parameters for transaction construction. Note:
        Transaction validity duration is hardcoded to 180 seconds (the maximum
        allowed by the Hedera network).
      type: object
      properties:
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: HBAR
          enum:
            - HBAR
        maxTransactionFee:
          description: Maximum transaction fee in HBAR
          type: string
        nodeAccountId:
          description: Node account to submit the transaction to (e.g., "0.0.3")
          type: string
          example: 0.0.3
        validStartTimestampNanos:
          description: Nanoseconds component (0-999999999) of the valid start timestamp.
          type: integer
          format: int32
          example: 123456789
        validStartTimestampSecs:
          description: >-
            Unix epoch seconds from which the transaction is valid. Must be
            greater than 0.
          type: integer
          format: int64
          example: 1234567890
      additionalProperties: false
      required:
        - mainnetNetworkId
        - validStartTimestampSecs
        - validStartTimestampNanos
        - maxTransactionFee
        - nodeAccountId
      title: Hedera Network Specific
    NEARNetworkSpecific:
      description: NEAR-specific network parameters for transaction construction
      type: object
      properties:
        blockHash:
          description: Recent block hash for replay protection (base58 encoded)
          type: string
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: NEAR
          enum:
            - NEAR
        nonce:
          description: Access key nonce for the sender
          type: string
      additionalProperties: false
      required:
        - mainnetNetworkId
        - nonce
        - blockHash
      title: NEAR Network Specific
    DOTNetworkSpecific:
      description: >-
        Polkadot-specific network parameters for transaction construction.
        Transactions are immortal by default. Provide mortalEra to make the
        transaction expire after a certain number of blocks.
      type: object
      properties:
        mainnetNetworkId:
          description: >-
            Discriminator field. Always set to the mainnet network ID, even when
            constructing transactions for testnets.
          type: string
          default: POLKADOT
          enum:
            - POLKADOT
        mortalEra:
          description: >-
            If provided, the transaction expires after a certain number of
            blocks. If omitted, the transaction is immortal (never expires).
          type: object
          additionalProperties: false
          properties:
            blockHash:
              description: Checkpoint block hash for the mortal era
              type: string
            blockNumber:
              description: >-
                Block number corresponding to the checkpoint block hash, used to
                compute the mortal era phase
              type: integer
              format: uint64
            period:
              description: >-
                Number of blocks the transaction is valid for (must be a power
                of 2, between 4 and 65536)
              type: integer
          required:
            - period
            - blockNumber
            - blockHash
        nonce:
          description: Account nonce for replay protection
          type: string
        specVersion:
          description: >-
            Runtime specification version. Query from the Polkadot node using
            state_getRuntimeVersion().
          type: integer
          format: uint32
        tip:
          description: Priority fee in DOT to incentivize inclusion
          type: string
      additionalProperties: false
      required:
        - mainnetNetworkId
        - nonce
        - specVersion
      title: Polkadot Network Specific
    SolanaCreateNonceAccountTemplate:
      description: Template for creating a Solana nonce account transaction
      type: object
      properties:
        authorityAddress:
          description: >-
            The public key address that will have authority over the nonce
            account
          type: string
          example: 3z9vL1zjN6qyAFHhHQdWYRTFAcy69pJydkZmSFBKHg1R
        computeUnitLimit:
          description: >-
            Maximum compute units the transaction can consume. If not specified,
            the runtime will compute a default value.
          type: integer
          nullable: true
        computeUnitPrice:
          description: Price per compute unit in SOL. Used to prioritize transactions.
          type: string
          nullable: true
        nonceAccountAddress:
          description: The public key address of the nonce account to be created
          type: string
          example: 9aE476sH92Vz7DMPyq5WLPkrKWivxeuTKEFKd2sZZcde
        rent:
          description: Amount of SOL for rent exemption
          type: string
          example: '0.0015'
        replayProtectionParams:
          $ref: '#/components/schemas/SOLReplayProtectionParams'
        type:
          description: >-
            Discriminator field indicating this is a Solana nonce account
            creation template
          type: string
          default: SOLANA_CREATE_NONCE_ACCOUNT
          enum:
            - SOLANA_CREATE_NONCE_ACCOUNT
      additionalProperties: false
      required:
        - type
        - nonceAccountAddress
        - authorityAddress
        - rent
        - replayProtectionParams
      title: Solana Create Nonce Account Template
    StellarChangeTrustTemplate:
      description: >-
        Template for creating a Stellar ChangeTrust operation to establish a
        trustline. A trustline allows an account to hold and receive a
        non-native asset (any asset other than XLM).
      type: object
      properties:
        assetType:
          description: >-
            A unique string identifying a specific asset on a specific
            blockchain and environment (testnet, mainnet).
          type: string
          example: USDC
        baseFee:
          description: Base fee in XLM (optional, defaults to network base fee)
          type: string
          nullable: true
        limit:
          description: >-
            Maximum amount of the asset that the account can hold. Defaults to
            maximum possible if not specified. Set to '0' to remove the
            trustline.
          type: string
          example: '1000000.0000000'
          nullable: true
        sequenceNumber:
          description: Sequence number for the source account
          type: string
        type:
          description: >-
            Discriminator field indicating this is a Stellar ChangeTrust
            template
          type: string
          default: STELLAR_CHANGE_TRUST
          enum:
            - STELLAR_CHANGE_TRUST
      additionalProperties: false
      required:
        - type
        - assetType
        - sequenceNumber
      title: Stellar Change Trust Template
    RippleTrustSetTemplate:
      description: >-
        Template for creating a Ripple TrustSet transaction to establish a
        trustline. A trustline allows an account to hold and receive issued
        tokens (any asset other than XRP).
      type: object
      properties:
        assetType:
          description: >-
            A unique string identifying a specific asset on a specific
            blockchain and environment (testnet, mainnet).
          type: string
          example: USDC
        fee:
          description: Transaction fee in XRP
          type: string
        limit:
          description: >-
            Maximum amount of the asset that the account can hold. Defaults to
            maximum possible if not specified. Set to '0' to remove the
            trustline.
          type: string
          example: '1000000'
          nullable: true
        sequence:
          description: Sequence number for the source account
          type: string
        type:
          description: Discriminator field indicating this is a Ripple TrustSet template
          type: string
          default: RIPPLE_TRUST_SET
          enum:
            - RIPPLE_TRUST_SET
      additionalProperties: false
      required:
        - type
        - assetType
        - sequence
        - fee
      title: Ripple Trust Set Template
    RippleRequireDestinationTagTemplate:
      description: >-
        Template for an AccountSet transaction that sets or clears the
        asfRequireDest flag.


        When enabled (asfRequireDest set), the account rejects incoming payments
        that do not specify a destination tag.

        When disabled (asfRequireDest cleared), the account accepts incoming
        payments regardless of whether a destination tag is present.
      type: object
      properties:
        enable:
          description: >-
            True to set the asfRequireDest flag (require destination tags on
            incoming payments). False to clear the flag (allow payments without
            destination tags).
          type: boolean
        fee:
          description: Transaction fee in XRP
          type: string
        sequence:
          description: Sequence number for the source account
          type: string
        type:
          description: >-
            Discriminator field indicating this is a Ripple Require Destination
            Tag template
          type: string
          default: RIPPLE_REQUIRE_DESTINATION_TAG
          enum:
            - RIPPLE_REQUIRE_DESTINATION_TAG
      additionalProperties: false
      required:
        - type
        - enable
        - sequence
        - fee
      title: Ripple Require Destination Tag Template
    ConstructTransactionRequest:
      description: Request to construct a transaction
      type: object
      properties:
        clientReferenceId:
          description: >-
            Client-provided reference ID to track this transaction in their
            internal systems
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          nullable: true
        idempotencyKey:
          description: >-
            Client-provided idempotency key to ensure request is processed only
            once
          type: string
          example: e763a50d-aa82-4ec7-b5a3-89ad0462d248
          maxLength: 128
        sourceWalletId:
          description: >-
            Globally unique wallet identifier for the wallet that will pay
            transaction fees and sign the transaction
          type: string
        template:
          description: >-
            The transaction template specifying what transaction to construct.
            Use the 'type' field to discriminate between different transaction
            types.
          discriminator:
            propertyName: type
            mapping:
              SOLANA_CREATE_NONCE_ACCOUNT: '#/components/schemas/SolanaCreateNonceAccountTemplate'
              STELLAR_CHANGE_TRUST: '#/components/schemas/StellarChangeTrustTemplate'
              RIPPLE_TRUST_SET: '#/components/schemas/RippleTrustSetTemplate'
              RIPPLE_REQUIRE_DESTINATION_TAG: '#/components/schemas/RippleRequireDestinationTagTemplate'
          oneOf:
            - $ref: '#/components/schemas/SolanaCreateNonceAccountTemplate'
            - $ref: '#/components/schemas/StellarChangeTrustTemplate'
            - $ref: '#/components/schemas/RippleTrustSetTemplate'
            - $ref: '#/components/schemas/RippleRequireDestinationTagTemplate'
      additionalProperties: false
      required:
        - template
        - sourceWalletId
  securitySchemes:
