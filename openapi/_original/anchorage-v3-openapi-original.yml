  /wallet-operations/construct/transfer:
    post:
      operationId: constructTransferTransaction
      summary: Construct Transfer Transaction
      description: >-
        Permissions required: **Construct and sign transactions**


        Construct and sign a transfer transaction immediately.


        This endpoint signs the transaction right away. Use Propose Construct
        Transfer Transaction instead if you need

        an approval workflow before signing.


        Use Construct Transaction instead to construct another type of
        transaction.


        > Note: This endpoint does NOT broadcast the transaction to the
        blockchain.

        After construction and signing, the caller is responsible for
        broadcasting the transaction.


        This endpoint returns immediately with a `walletOperationId`. Poll `GET
        /wallet-operations/{walletOperationId}` to check

        the status and retrieve the signed transaction data once construction is
        complete. Use the signedTransaction

        field from the response to broadcast to the blockchain.
      parameters: []
      requestBody:
        description: Transfer transaction construction request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructTransferRequest'
      responses:
        '202':
          description: Transfer transaction construction request accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructWalletOperationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
        - Transaction Construction
  /wallet-operations/construct/propose-transfer:
    post:
      operationId: proposeConstructTransferTransaction
      summary: Propose Construct Transfer Transaction
      description: >-
        Permissions required: **Propose constructed transactions**


        Construct a transfer transaction for approval workflow. The transaction
        will not be signed until it receives

        the required endorsements.


        This endpoint constructs the transaction but defers signing. The
        operation will enter PENDING_ENDORSEMENT status

        and require approval through your organization's workflow before signing
        occurs.


        Use Construct Transfer Transaction instead if you want to sign
        immediately without an approval workflow.


        Use Propose Construct Transaction instead to construct another type of
        transaction with deferred signing.


        > Note: This endpoint does NOT broadcast the transaction to the
        blockchain.

        After construction and signing, the caller is responsible for
        broadcasting the transaction.


        This endpoint returns immediately with a `walletOperationId` in
        `PENDING_ENDORSEMENT` status. The transaction

        will not be signed until it receives the required endorsements through
        your approval workflow. Poll

        `GET /wallet-operations/{walletOperationId}` to check the status. Once
        endorsed and signed, use the

        signedTransaction field from the response to broadcast to the
        blockchain.
      parameters: []
      requestBody:
        description: Transfer transaction construction request for approval workflow
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructTransferRequest'
      responses:
        '202':
          description: >-
            Transfer transaction construction request accepted for approval
            workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructWalletOperationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
