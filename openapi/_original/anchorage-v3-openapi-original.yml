  /batch/wallets:
    post:
      operationId: createWalletsBatch
      summary: Create or Activate Wallets Batch
      description: >-
        Permissions required: **Create wallet**


        Create or activate multiple wallets in a single batch operation. A
        wallet exists on exactly one network.


        Supports three patterns:

        1. **Batch Create**: Create wallet sets across multiple networks.
        Creates `count` wallet sets, where each set contains one wallet per
        specified network, all sharing the same cryptographic keys. Total
        wallets created = count × number of networks.

        2. **Batch Activate (List)**: Activate specific wallets for new
        networks. For each source wallet and target network combination, creates
        a new wallet that shares keys with the source.

        3. **Batch Activate (Vault)**: Activate all wallets in a vault/network
        for new networks. For each wallet in the vault on the source network,
        creates new wallets on the target networks sharing the same keys.


        This endpoint returns immediately with a batchId. Poll GET
        /batch/wallets/{batchId} to check the status.

        Once complete, use GET /wallets?batchId={batchId} to retrieve the
        created/activated wallet details.


        For large batches (100k+ wallets), this endpoint supports best-effort
        processing:

        - COMPLETED status means at least some wallets succeeded

        - FAILED status means complete failure

        - Query results with batchId to see which wallets were created/activated
      parameters: []
      requestBody:
        description: Batch wallet creation or activation request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletsBatchRequest'
      responses:
        '202':
          description: Batch wallet operation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
