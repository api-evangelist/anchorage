                $ref: '#/components/schemas/ErrorDetails'
        '501':
          description: Not Implemented Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tax
      x-security:
        Subaccount: present
  /tax/transaction/{transactionId}/tag:
    post:
      operationId: tagTaxTransaction
      summary: Add Tag to Transaction
      description: 'Permissions required: **Subaccount**


        Tag a prior transaction for tax purposes.


        ** Under development **'
      parameters:
      - name: transactionId
        in: path
        description: The ID of the transaction to tag (Same as the one returned for Transactions in the Subaccounts API )
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagTaxTransactionRequest'
      responses:
        '202':
          description: Accepted tagging request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagTaxTransactionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '501':
          description: Not Implemented Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Tax
      x-security:
        Subaccount: present
    delete:
      operationId: untagTaxTransaction
      summary: Remove Tag from Transaction
      description: 'Permissions required: **Subaccount**


        Remove tax tag for a prior transaction.


        ** Under development **'
      parameters:
      - name: transactionId
        in: path
        description: The ID of the transaction to tag (Same as the one returned for Transactions in the Subaccounts API )
        required: true
        schema:
          type: string
      - name: accountId
        in: query
        description: The subaccount for which the transaction happened.
        required: true
        schema:
          type: string
          example: SubaccountID
      responses:
        '202':
          description: Accepted tag removal request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UntagTaxTransactionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
