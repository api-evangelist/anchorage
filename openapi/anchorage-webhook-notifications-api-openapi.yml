openapi: 3.2.0
info:
  version: 2.0.0
  title: Anchorage Digital API Reference Webhook Notifications API
  contact:
    email: api@anchorage.com
  description: '# Introduction

    *CONFIDENTIAL: Please do not distribute this documentation externally without prior Anchorage Digital approval.*


    The Anchorage Digital REST API v2.0 provides a set of operations and resources that allow Anchorage Digital clients and partners to:

    - Programmatically transfer funds from an Anchorage Digital vault or wallet without human intervention

    - Create and list deposit addresses in a vault

    - Read and monitor vault balances

    - Query transaction history including deposits

    …'
servers:
- url: https://api.anchorage-staging.com/v2
security:
- Api-Access-Key: []
tags:
- description: ''
  name: Webhook Notifications
paths:
  /webhook/validation-key:
    get:
      operationId: getWebhookValidationKey
      summary: Get webhook validation key
      description: 'Permissions required: **Configure Webhooks**


        Get key to validate webhook authenticity.'
      parameters: []
      responses:
        '200':
          description: Webhook event type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
                required:
                - value
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
  /webhook/event-types:
    get:
      operationId: listWebhookEventTypes
      summary: List webhook event types
      description: 'Permissions required: **Configure Webhooks**


        List the available webhook event types that you can subscribe to.'
      parameters:
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Webhook event type list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEventType'
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                - data
                - page
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
  /webhook/endpoints:
    post:
      operationId: createWebhookEndpoints
      summary: Create webhook endpoint
      description: 'Permissions required: **Configure Webhooks**


        Create a new endpoint where you would like to receive webhook notifications.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NewWebhookEndpoint'
              title: CreateWebhookEndpointsRequest
      responses:
        '201':
          description: Created webhook endpoint ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookEndpointsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoint
      description: 'Permissions required: **Configure Webhooks**


        List all of your webhook endpoints.'
      parameters:
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Webhook endpoint list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpointResponse'
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                - data
                - page
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
  /webhook/endpoints/{endpointId}:
    get:
      operationId: getWebhookEndpoint
      summary: Get webhook endpoint config
      description: 'Permissions required: **Configure Webhooks**


        Get the configuration details for an endpoint.'
      parameters:
      - name: endpointId
        in: path
        description: Unique identifier for the endpoint
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookEndpointResponse'
                required:
                - data
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
    patch:
      operationId: updateWebhookEndpoint
      summary: Update webhook endpoint
      description: 'Permissions required: **Configure Webhooks**


        Update the configuration for an endpoint.'
      parameters:
      - name: endpointId
        in: path
        description: Unique identifier for the endpoint
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointPatch'
      responses:
        '200':
          description: Successfully updated webhook endpoint
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
  /webhook/endpoints/{endpointId}/subscriptions:
    post:
      operationId: createWebhookEndpointSubscriptions
      summary: Create webhook subscriptions
      description: 'Permissions required: **Configure Webhooks**


        Subscribe to event types to receive notifications in a webhook endpoint.'
      parameters:
      - name: endpointId
        in: path
        description: Unique identifier for the endpoint
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NewWebhookEndpointSubscription'
              title: CreateWebhookEndpointSubscriptionsRequest
      responses:
        '201':
          description: Successfully created webhook subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookSubscriptionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
    get:
      operationId: listWebhookEndpointSubscriptions
      summary: List webhook endpoint subscriptions
      description: 'Permissions required: **Configure Webhooks**


        List the subscriptions that you configured for a webhook endpoint.'
      parameters:
      - name: endpointId
        in: path
        description: Unique identifier for the endpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: afterId
        in: query
        description: When paginating this is used to provide the starting point for the page to fetch (retrieved from the previous response body)
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return per query
        schema:
          type: integer
          format: int64
          default: 25
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Webhook subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpointSubscription'
                  page:
                    $ref: '#/components/schemas/Page'
                required:
                - data
                - page
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
  /webhook/endpoints/{endpointId}/subscriptions/{eventTypeId}:
    delete:
      operationId: cancelWebhookEndpointSubscription
      summary: Cancel webhook subscription
      description: 'Permissions required: **Configure Webhooks**


        Cancel a webhook subscription to stop receiving notifications for its event type in its webhook endpoint.'
      parameters:
      - name: endpointId
        in: path
        description: Unique identifier for the endpoint
        required: true
        schema:
          type: string
          format: uuid
      - name: eventTypeId
        in: path
        description: concatenation of topic+"."+name
        required: true
        schema:
          type: string
        example: withdrawal.initiated
      responses:
        '204':
          description: Successfully canceled webhook subscription
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
      tags:
      - Webhook Notifications
components:
  schemas:
    WebhookEndpointSubscription:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        eventTypeId:
          type: string
      required:
      - createdAt
      - eventTypeId
    WebhookEventType:
      type: object
      properties:
        description:
          type: string
        id:
          type: string
      example:
        id: transfer.completed
        description: Notification of a successful transfer that is now completed
      required:
      - id
      - description
    WebhookEndpointPatch:
      type: object
      properties:
        description:
          type: string
        publicKey:
          type: string
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NewWebhookEndpointSubscription'
        url:
          type: string
          format: uri
      additionalProperties: false
      title: WebhookEndpointPatch
    CreateWebhookEndpointsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: string
            format: uuid
      required:
      - data
      title: CreateWebhookEndpointsResponse
    WebhookEndpointResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
          format: uuid
        publicKey:
          type: string
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
      example:
        id: accf45c9-f08e-4b5f-a3b0-162b94baf5a0
        description: Endpoint to receive transaction notifications.
        createdAt: '2024-08-08T13:44:00.234524Z'
        updatedAt: '2024-08-08T13:44:00.234526Z'
        publicKey: '-----BEGIN PUBLIC KEY-----

          MFYwEAYHKoZIzj0CAQYFK4EEAAoDQgAEeg+pxTCsjew/+7IK4+Vw5zyHDnMW7bzn

          sClhuYIKjXF8EJ1lfyZC2VPVullBKgvHRzNMfC1KkF2LIoRp2ibcWQ==

          -----END PUBLIC KEY-----'
        url: https://your-domain.com/transaction-webhooks
      required:
      - id
      - createdAt
      - url
      title: WebhookEndpoint
    NewWebhookEndpoint:
      type: object
      properties:
        description:
          type: string
        publicKey:
          type: string
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/NewWebhookEndpointSubscription'
        url:
          description: url of the endpoint, requires http:// prefix
          type: string
          format: uri
      example:
        url: https://your-domain.com/transaction-webhooks
        description: Endpoint for receiving transaction event webhooks
        subscriptions:
        - eventTypeId: withdrawal.initiated
        publicKey: '----BEGIN PUBLIC KEY-----

          MFYwEAYHKoZIzj0CAQYFK4EEAAoDQgAEeg+pxTCsjew/+7IK4+Vw5zyHDnMW7bzn

          sClhuYIKjXF8EJ1lfyZC2VPVullBKgvHRzNMfC1KkF2LIoRp2ibcWQ==

          -----END PUBLIC KEY-----'
      additionalProperties: false
      required:
      - url
      title: NewWebhookEndpoint
    Page:
      description: Pagination info
      type: object
      properties:
        next:
          description: URL to use to query for the next page or null if no additional results are available
          type:
          - string
          - 'null'
          example: <next page url>
          x-omitempty: false
      title: Page
    NewWebhookEndpointSubscription:
      type: object
      properties:
        eventTypeId:
          type: string
      additionalProperties: false
      required:
      - eventTypeId
    CreateWebhookSubscriptionsResponse:
      type: object
      properties: {}
      title: CreateWebhookSubscriptionsResponse
    ErrorType:
      description: The type of error returned.
      type: string
      enum:
      - InternalError
      - InvalidRequest
      - Unauthenticated
      - Forbidden
      - NotFound
      - Conflict
      - UnprocessableEntity
      - TooManyRequests
      - ServiceUnavailable
      - QuoteExpired
      - InsufficientFunds
      - NotImplemented
      title: ErrorType
    ErrorDetails:
      type: object
      properties:
        errorType:
          $ref: '#/components/schemas/ErrorType'
        message:
          description: A human-readable message providing more details about the error.
          type: string
          example: Missing required field 'amount'.
      required:
      - errorType
      - message
      title: ErrorDetails
  securitySchemes:
    Api-Access-Key:
      type: apiKey
      name: Api-Access-Key
      in: header
      description: An API key associated with a security role
x-tagGroups:
- name: Under Development
  tags:
  - Collateral Management
  - Holds
  - Deposit Attribution
  - Onboarding
  - Trusted Destinations
  - Atlas Settlement Network
  - Tax
- name: API Endpoints
  tags:
  - Addresses
  - Asset Types
  - Transactions
  - Transfers
  - Wallets
  - Vaults
  - Vesting
  - Tagging
  - Subaccounts
  - Stablecoins
  - Webhook Notifications
  - API Key
  - Statements
  - Tax Reporting
  - Trading
- name: Models
  tags:
  - Transfer Model
  - Transaction Model
  - Vault Model
  - Deposit Attribution Model
