overlay: 1.0.0
info:
  title: API Evangelist enhancements for Anchorage Digital API v2
  version: 1.0.0
extends: openapi/anchorage-v2-openapi-original.yml
actions:
- target: $.info
  update:
    x-apievangelist-network: https://apis.io/provider/anchorage
    x-api-evangelist-idempotency: idempotentId field in POST bodies
    x-api-evangelist-rate-limit: 20 req/s per organization, burst 100
    x-api-evangelist-production-server: https://api.anchorage.com/v2
- target: $.servers
  update:
  - url: https://api.anchorage.com/v2
    description: Production
  - url: https://api.anchorage-staging.com/v2
    description: Sandbox
